const cv=document.getElementById('c'),x=cv.getContext('2d'),W=960,H=540,GY=H-60;
const im={};let loaded=0,started=false;
for(const k in IMG){im[k]=new Image();im[k].onload=()=>{if(++loaded==3)init()};im[k].src=IMG[k]}
const PW=240,PH=Math.round(PW*156/300),CH=84,CW=Math.round(CH*141/120),GOAL=16000;
let st,pl,items,clouds,score,best=0,t,speed,spawnT,up=0,down=0,touchY=null,ac,dist,arrived;
function beep(f,d,ty){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function init(){clouds=[];for(let i=0;i<8;i++)clouds.push({x:Math.random()*W,y:Math.random()*260,s:.6+Math.random()*.8});
st='menu';reset();if(!started){started=true;loop()}}
function reset(){pl={x:90,y:H/2-PH/2,vy:0};items=[];score=0;t=0;speed=4;spawnT=50;dist=0;arrived=0}
function start(){reset();st='play';beep(500,.1)}
function press(){if(st==='menu'||st==='over')start()}
addEventListener('keydown',e=>{if(['ArrowUp','KeyW'].includes(e.code))up=1;if(['ArrowDown','KeyS'].includes(e.code))down=1;if(e.code==='Space'||e.code==='Enter')press();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{if(['ArrowUp','KeyW'].includes(e.code))up=0;if(['ArrowDown','KeyS'].includes(e.code))down=0});
function ty(e){const r=cv.getBoundingClientRect();return (e.clientY-r.top)/r.height*H}
cv.addEventListener('pointerdown',e=>{press();touchY=ty(e)});
cv.addEventListener('pointermove',e=>{if(touchY!==null)touchY=ty(e)});
addEventListener('pointerup',()=>touchY=null);
function spawn(){
 const r=Math.random();
 if(r<.5)items.push({k:'cup',x:W+40,y:60+Math.random()*(GY-CH-150),w:CW,h:CH,ph:Math.random()*6,sp:0});
 else{const o=['building','building','palm','palm','bird','enemy','balloon','cloud'][Math.floor(Math.random()*8)];
  let it={k:o,x:W+80,ph:0,sp:0};
  if(o==='building'){it.w=100;it.h=130+Math.random()*120;it.y=GY-it.h;it.c=Math.floor(Math.random()*4)}
  else if(o==='palm'){it.w=90;it.h=150+Math.random()*80;it.y=GY-it.h}
  else if(o==='bird'){it.w=60;it.h=34;it.y=50+Math.random()*(GY-200);it.sp=1}
  else if(o==='enemy'){it.w=100;it.h=40;it.y=50+Math.random()*(GY-200);it.sp=2.5}
  else if(o==='balloon'){it.w=70;it.h=100;it.y=40+Math.random()*(GY-260);it.sp=.3}
  else{it.w=120;it.h=60;it.y=40+Math.random()*(GY-200)}
  items.push(it)}
 spawnT=Math.max(26,64-score*.8)+Math.random()*28}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){
 t++;for(const c of clouds){c.x-=c.s*(st==='play'?speed*.3:.5);if(c.x<-170){c.x=W+60;c.y=Math.random()*260}}
 if(st==='menu'||st==='over'&&false)return;
 if(st==='over')return;
 speed=4+Math.min(4,score*.08);dist+=speed;if(dist>=GOAL&&!arrived){arrived=t;beep(800,.2,'sine');beep(1200,.3,'sine')}
 let dir=down-up;if(touchY!==null){const d=touchY-(pl.y+PH/2);dir=Math.abs(d)<12?0:Math.sign(d)}
 pl.vy+=(dir*6.5-pl.vy)*.18;pl.y+=pl.vy;pl.y=Math.max(8,Math.min(GY-PH+20,pl.y));
 if(--spawnT<=0)spawn();
 const hb={x:pl.x+45,y:pl.y+PH*.28,w:PW-110,h:PH*.42};
 for(const o of items){o.x-=speed+o.sp;o.ph+=.15;if(o.k==='bird')o.y+=Math.sin(o.ph)*1.2;
  if(o.dead)continue;
  const bx=o.k==='building'||o.k==='palm'?{x:o.x+12,y:o.y+(o.k==='palm'?0:4),w:o.w-24,h:o.h}:{x:o.x+6,y:o.y+6,w:o.w-12,h:o.h-12};
  if(!hit(hb,bx))continue;
  if(o.k==='cup'){o.dead=1;score++;beep(700,.1,'sine');beep(1100,.15,'sine')}
  else{st='over';best=Math.max(best,score);beep(150,.4,'sawtooth');return}}
 items=items.filter(o=>!o.dead&&o.x>-200)}
function cloud(cx,cy,s,col){x.fillStyle=col;x.beginPath();for(const [dx,dy,r] of [[0,0,26],[28,-12,32],[62,0,26],[30,8,28]]){x.moveTo(cx+dx*s+r*s,cy+dy*s);x.arc(cx+dx*s,cy+dy*s,r*s,0,7)}x.fill()}
function lerp(a,b,m){return Math.round(a+(b-a)*m)}
const BC=['#c96b5a','#d9a441','#5f8ec9','#8d6fb3'];
function building(o,px,py,w,h,col,lit){x.fillStyle=col;x.fillRect(px,py,w,h);x.fillStyle='rgba(0,0,0,.18)';x.fillRect(px+w-10,py,10,h);
 x.fillStyle=lit?'#ffe9a0':'#cfe8ff';for(let yy=py+14;yy<py+h-14;yy+=26)for(let xx=px+12;xx<px+w-20;xx+=24)x.fillRect(xx,yy,12,14);
 x.fillStyle='#444';x.fillRect(px-4,py-6,w+8,8)}
function drawItem(o){
 if(o.k==='cup'){x.drawImage(im.cup,o.x,o.y+Math.sin(o.ph)*5,o.w,o.h)}
 else if(o.k==='building'){building(o,o.x,o.y,o.w,o.h,BC[o.c],0)}
 else if(o.k==='palm'){const bx=o.x+o.w/2,top=o.y+20;x.strokeStyle='#8a5a2b';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(bx,GY);x.quadraticCurveTo(bx-18,(GY+top)/2,bx+6,top);x.stroke();
  x.fillStyle='#2e9a45';for(let i=0;i<6;i++){const a=-Math.PI+i*Math.PI/5;x.save();x.translate(bx+6,top);x.rotate(a);x.beginPath();x.ellipse(32,0,36,9,0,0,7);x.fill();x.restore()}
